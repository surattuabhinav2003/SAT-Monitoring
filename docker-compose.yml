services:
  db:
    image: postgres:16-alpine
    container_name: sat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sat_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-sat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sat_local_password}
    # No `ports` in production: the database should only be reachable on the
    # internal compose network. Uncomment locally to inspect it with psql.
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - sat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sat} -d ${POSTGRES_DB:-sat_monitoring}']
      interval: 5s
      timeout: 5s
      retries: 12

  # =========================================================================
  # API — serves the SPA's REST calls.
  #
  # HAS NO DOCKER ACCESS. There is deliberately no docker.sock mount here: the
  # socket is root-equivalent on the host, and the API is the process exposed to
  # authenticated users. A manual scan is REQUESTED from the worker over a
  # Postgres NOTIFY channel instead.
  # =========================================================================
  api:
    build: ./backend
    container_name: sat-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-sat}:${POSTGRES_PASSWORD:-sat_local_password}@db:5432/${POSTGRES_DB:-sat_monitoring}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5180}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      ADMIN_ALLOWED_DOMAINS: ${ADMIN_ALLOWED_DOMAINS:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS:-false}
      DEV_AUTH_EMAIL: ${DEV_AUTH_EMAIL:-}
      # Never enable discovery in the API — that would require the socket.
      DISCOVERY_ENABLED: 'false'
      DISCOVERY_OPERATORS: ${DISCOVERY_OPERATORS:-}
    ports:
      - '4000:4000'
    # Defence in depth: the API needs no write access to its own filesystem and
    # no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # =========================================================================
  # Discovery worker — the ONLY component with Docker access.
  #
  # Reads the local socket read-only, writes findings to Postgres, and listens
  # for on-demand run requests. Exposes no ports: nothing can reach it over the
  # network, so its Docker privilege has no external attack surface.
  # =========================================================================
  worker:
    build: ./backend
    container_name: sat-worker
    restart: unless-stopped
    command: ['node', 'src/discovery/worker.js']
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-sat}:${POSTGRES_PASSWORD:-sat_local_password}@db:5432/${POSTGRES_DB:-sat_monitoring}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      DISCOVERY_ENABLED: 'true'
      DISCOVERY_CRON: ${DISCOVERY_CRON:-*/5 * * * *}
      DISCOVERY_URL_SCHEME: ${DISCOVERY_URL_SCHEME:-https}
      DISCOVERY_EXCLUDE: ${DISCOVERY_EXCLUDE:-}
      DISCOVERY_EXCLUDE_DEFAULTS: ${DISCOVERY_EXCLUDE_DEFAULTS:-true}
      # Where the worker reads nginx vhosts to map hostnames to containers.
      # Always set inside the container; what matters is which HOST directory is
      # mounted there (NGINX_CONF_HOST_DIR below). An empty directory simply
      # yields no routes, so unmapped applications are flagged for an admin
      # rather than given a guessed URL.
      NGINX_CONF_DIR: /etc/nginx-sat
    volumes:
      # SECURITY: root-equivalent on the host. Confined to this container, which
      # has no ports published and serves no user traffic.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # nginx vhosts, read-only. Point NGINX_CONF_HOST_DIR at the real directory
      # on the server (e.g. /etc/nginx/sites-enabled); it defaults to the empty
      # ./nginx-conf folder so a fresh clone starts without nginx mapping.
      - ${NGINX_CONF_HOST_DIR:-./nginx-conf}:/etc/nginx-sat:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  sat_pgdata:
