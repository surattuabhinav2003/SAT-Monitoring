# ===========================================================================
# SAT Monitoring — local discovery test harness
#
#   docker compose -p sattest -f docker-compose.test.yml up -d --build
#   node scripts/test-discovery.mjs
#   docker compose -p sattest -f docker-compose.test.yml down -v
#
# Isolated from the normal stack: own project name, volume and ports
# (API 4200, DB 5434), so real data is never touched.
#
# Mirrors the PRODUCTION shape: only the worker gets the Docker socket, and the
# API requests scans over Postgres NOTIFY.
# ===========================================================================

name: sattest

services:
  db:
    image: postgres:16-alpine
    container_name: sattest-db
    environment:
      POSTGRES_DB: sat_test
      POSTGRES_USER: sat
      POSTGRES_PASSWORD: sat_test_password
    ports:
      - '127.0.0.1:5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sat -d sat_test']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    container_name: sattest-api
    labels:
      sat.ignore: 'true'
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://sat:sat_test_password@db:5432/sat_test
      CORS_ORIGINS: http://localhost:5180
      SEED_ADMIN_EMAIL: tester@cloudfuze.com
      ADMIN_ALLOWED_DOMAINS: cloudfuze.com
      # Auth bypassed so the test script can call the API without a tenant.
      DEV_AUTH_BYPASS: 'true'
      DEV_AUTH_EMAIL: tester@cloudfuze.com
      # NO Docker access, exactly as in production.
      DISCOVERY_ENABLED: 'false'
    ports:
      - '4200:4000'
    # Deliberately NO docker.sock mount — the tests assert the API cannot reach
    # Docker and must delegate to the worker.

  worker:
    build: ./backend
    container_name: sattest-worker
    command: ['node', 'src/discovery/worker.js']
    labels:
      sat.ignore: 'true'
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://sat:sat_test_password@db:5432/sat_test
      SEED_ADMIN_EMAIL: tester@cloudfuze.com
      DISCOVERY_ENABLED: 'true'
      # Long schedule: the tests drive passes explicitly so assertions are
      # deterministic rather than racing a cron tick.
      DISCOVERY_CRON: '0 3 * * *'
      DISCOVERY_URL_SCHEME: http
      NGINX_CONF_DIR: /etc/nginx-sat
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Fixture nginx config, exercising URL priority 2.
      - ./scripts/fixtures/nginx:/etc/nginx-sat:ro

  # --- Fake tools -----------------------------------------------------------
  # tool1: sat.url label            -> URL from the label      (priority 1)
  # tool2: no label, in nginx conf  -> URL from nginx           (priority 2)
  # tool3: no label, not in nginx   -> Needs Mapping            (priority 3)
  tool1:
    image: nginx:alpine
    container_name: sattest-tool1
    labels:
      sat.name: Tool One
      sat.url: tool-one.test.local

  tool2:
    image: httpd:alpine
    container_name: sattest-tool2
    labels:
      sat.name: Tool Two

  tool3:
    image: httpd:alpine
    container_name: sattest-tool3
    labels:
      sat.name: Tool Three
