# Fixture nginx configuration for the discovery tests.
#
# Exercises URL resolution priority 2: tool2 has no `sat.url` label, so its
# hostname must come from this routing table. tool3 is deliberately absent so it
# ends up flagged "Needs Mapping" rather than given a guessed hostname.

upstream tool_two_upstream {
    server sattest-tool2:80;
}

server {
    listen 80;
    server_name tool-two-from-nginx.test.local;

    location / {
        proxy_pass http://tool_two_upstream;
    }
}

# A commented-out vhost must be ignored, not treated as live routing.
# server {
#     server_name should-be-ignored.test.local;
#     location / { proxy_pass http://sattest-tool3:80; }
# }

# Catch-all with no proxy_pass — must not map to anything.
server {
    listen 80 default_server;
    server_name _;
    return 404;
}
